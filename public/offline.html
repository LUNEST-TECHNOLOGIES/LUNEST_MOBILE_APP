(function(){var retry=document.getElementById('retry'),busy=false;function openApp(){var url=new URL(location.href);url.searchParams.set('__lunest_recover',Date.now());location.replace(url.href);}retry.addEventListener('click',openApp);async function reconnect(){if(busy||navigator.onLine===false)return;busy=true;var controller=new AbortController(),timer=setTimeout(function(){controller.abort();},4000);try{var response=await fetch('/?__lunest_probe='+Date.now(),{cache:'no-store',signal:controller.signal});if(response.ok)openApp();}catch(_){}finally{clearTimeout(timer);busy=false;}}window.addEventListener('online',reconnect);setInterval(reconnect,15000);})();
